<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1104" role="img" aria-labelledby="title desc">
<title id="title">Selective quantization in PI0.5</title><desc id="desc">The W4A16 preset quantizes language and action-expert attention and MLP weights to INT4, while other layers keep configured precision. Humming executes the selected GEMMs.</desc>
