<text x="56" y="389" font-size="21" font-weight="400" fill="#d8e7ff" text-anchor="start" class="">Layer matching · precision · execution</text>
<path d="M280 424V461" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="470" width="496" height="213" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
