<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc">
<title id="title">From model operation to execution kernel</title><desc id="desc">Operation requirements and a user policy select a compatible backend. Prepared choices are reused on repeated calls.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#0756c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="560" height="1100" rx="18" fill="#fff"/>
<style>text {font-family: 'Helvetica Neue', Arial, sans-serif;} .mono {font-family: 'SFMono-Regular', Consolas, monospace;}</style>
<text x="32" y="40" font-size="16" font-weight="700" fill="#0756c9" text-anchor="start" class="">KERNEL DISPATCH</text>
<text x="32" y="80" font-size="30" font-weight="600" fill="#191c19" text-anchor="start" class="">A model call,</text>
<text x="32" y="116" font-size="30" font-weight="600" fill="#191c19" text-anchor="start" class="">a compatible kernel</text>
<rect x="32" y="150" width="496" height="202" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<text x="56" y="190" font-size="25" font-weight="600" fill="#082b61" text-anchor="start" class="">Model operation</text>
<text x="56" y="227" font-size="21" font-weight="400" fill="#555b54" text-anchor="start" class="">GEMM / Attention / Norm</text>
<text x="56" y="267" font-size="21" font-weight="400" fill="#555b54" text-anchor="start" class="">GPU · shape · dtype · weight layout</text>
<text x="56" y="307" font-size="21" font-weight="400" fill="#555b54" text-anchor="start" class="">Model role · CUDA Graph mode</text>
<path d="M280 352V391" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="400" width="496" height="266" rx="12" fill="#082b61" stroke="#082b61"/>
<text x="56" y="442" font-size="28" font-weight="600" fill="white" text-anchor="start" class="">PhyAI dispatcher</text>
<text x="56" y="490" font-size="21" font-weight="400" fill="white" text-anchor="start" class="">01  Check kernel capabilities</text>
<text x="56" y="537" font-size="21" font-weight="400" fill="white" text-anchor="start" class="">02  Apply the YAML policy</text>
<text x="56" y="584" font-size="21" font-weight="400" fill="white" text-anchor="start" class="">03  Prepare a compatible implementation</text>
<text x="56" y="635" font-size="20" font-weight="400" fill="#d8e7ff" text-anchor="start" class="">Policy controls priorities and fallback.</text>
<path d="M280 666V705" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="714" width="496" height="145" rx="12" fill="white" stroke="#c8ccc7"/>
<text x="56" y="755" font-size="23" font-weight="600" fill="#191c19" text-anchor="start" class="">Selected backend</text>
<text x="56" y="795" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">FlashInfer · Humming</text>
<text x="56" y="827" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">PhyAI kernels · reference implementations</text>
<path d="M280 859V898" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="907" width="496" height="118" rx="12" fill="#d9ed69" stroke="#d9ed69"/>
<text x="56" y="949" font-size="25" font-weight="600" fill="#082b61" text-anchor="start" class="">Cache and execute</text>
<text x="56" y="989" font-size="20" font-weight="400" fill="#082b61" text-anchor="start" class="">Reuse prepared choices on repeated calls.</text>
<text x="32" y="1060" font-size="18" font-weight="400" fill="#555b54" text-anchor="start" class="">Optional autotune measures supported operations.</text>
</svg>
