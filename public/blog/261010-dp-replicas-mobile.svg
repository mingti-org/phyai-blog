<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1100" role="img" aria-labelledby="title desc">
<title id="title">One model, four independent replicas</title>
<desc id="desc">Conceptual inference data parallelism, with no measured speedup claim. Independent requests, including caller-prepared batches, enter one Engine and RequestDispatcher. Each whole request is routed to one complete PI0.5 model replica on GPU 0, 1, 2, or 3. The replicas process different inputs concurrently. Each request has its own result or future. More replicas increase independent work capacity; one request stays within one replica. There is no automatic global batch split or merge and no training gradient synchronization.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#0756c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text {font-family: "Helvetica Neue", Arial, sans-serif;}</style>
<rect width="560" height="1100" rx="18" fill="#fff"/>
<text x="32" y="40" font-size="16" font-weight="700" fill="#0756c9" text-anchor="start">CONCEPTUAL INFERENCE DP</text>
<text x="32" y="81" font-size="30" font-weight="600" fill="#191c19" text-anchor="start">One model,</text>
<text x="32" y="117" font-size="30" font-weight="600" fill="#191c19" text-anchor="start">four independent replicas</text>
<text x="32" y="154" font-size="22" font-weight="400" fill="#555b54" text-anchor="start">Different inputs run concurrently.</text>
<rect x="32" y="180" width="496" height="80" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<text x="280" y="212" font-size="24" font-weight="600" fill="#082b61" text-anchor="middle">Independent requests</text>
<text x="280" y="244" font-size="22" font-weight="400" fill="#555b54" text-anchor="middle">or caller-prepared batches</text>
<path d="M280 260V281" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="290" width="496" height="89" rx="12" fill="#082b61" stroke="#082b61"/>
<text x="280" y="326" font-size="25" font-weight="600" fill="#fff" text-anchor="middle">Engine / RequestDispatcher</text>
<text x="280" y="359" font-size="22" font-weight="400" fill="#d8e7ff" text-anchor="middle">Routes each whole request</text>
<path d="M280 379V401H52V813" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="52" cy="471" r="20" fill="#0756c9"/>
<text x="52" y="479" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">A</text>
<path d="M72 471H85" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="94" y="422" width="434" height="100" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<rect x="108" y="433" width="77" height="29" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="146.5" y="454" font-size="20" font-weight="600" fill="#082b61" text-anchor="middle">GPU 0</text>
<text x="207" y="454" font-size="21" font-weight="600" fill="#082b61" text-anchor="start">Replica 0</text>
<rect x="108" y="473" width="216" height="35" rx="7" fill="#082b61" stroke="#082b61"/>
<text x="216" y="498" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Complete PI0.5</text>
<path d="M324 490.5H360" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="368" y="473" width="144" height="35" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="440" y="498" font-size="22" font-weight="600" fill="#082b61" text-anchor="middle">Result A</text>
<circle cx="52" cy="585" r="20" fill="#0756c9"/>
<text x="52" y="593" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">B</text>
<path d="M72 585H85" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="94" y="536" width="434" height="100" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<rect x="108" y="547" width="77" height="29" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="146.5" y="568" font-size="20" font-weight="600" fill="#082b61" text-anchor="middle">GPU 1</text>
<text x="207" y="568" font-size="21" font-weight="600" fill="#082b61" text-anchor="start">Replica 1</text>
<rect x="108" y="587" width="216" height="35" rx="7" fill="#082b61" stroke="#082b61"/>
<text x="216" y="612" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Complete PI0.5</text>
<path d="M324 604.5H360" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="368" y="587" width="144" height="35" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="440" y="612" font-size="22" font-weight="600" fill="#082b61" text-anchor="middle">Result B</text>
<circle cx="52" cy="699" r="20" fill="#0756c9"/>
<text x="52" y="707" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">C</text>
<path d="M72 699H85" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="94" y="650" width="434" height="100" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<rect x="108" y="661" width="77" height="29" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="146.5" y="682" font-size="20" font-weight="600" fill="#082b61" text-anchor="middle">GPU 2</text>
<text x="207" y="682" font-size="21" font-weight="600" fill="#082b61" text-anchor="start">Replica 2</text>
<rect x="108" y="701" width="216" height="35" rx="7" fill="#082b61" stroke="#082b61"/>
<text x="216" y="726" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Complete PI0.5</text>
<path d="M324 718.5H360" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="368" y="701" width="144" height="35" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="440" y="726" font-size="22" font-weight="600" fill="#082b61" text-anchor="middle">Result C</text>
<circle cx="52" cy="813" r="20" fill="#0756c9"/>
<text x="52" y="821" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">D</text>
<path d="M72 813H85" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="94" y="764" width="434" height="100" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<rect x="108" y="775" width="77" height="29" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="146.5" y="796" font-size="20" font-weight="600" fill="#082b61" text-anchor="middle">GPU 3</text>
<text x="207" y="796" font-size="21" font-weight="600" fill="#082b61" text-anchor="start">Replica 3</text>
<rect x="108" y="815" width="216" height="35" rx="7" fill="#082b61" stroke="#082b61"/>
<text x="216" y="840" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">Complete PI0.5</text>
<path d="M324 832.5H360" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="368" y="815" width="144" height="35" rx="7" fill="#d9ed69" stroke="#d9ed69"/>
<text x="440" y="840" font-size="22" font-weight="600" fill="#082b61" text-anchor="middle">Result D</text>
<text x="32" y="906" font-size="22" font-weight="400" fill="#555b54" text-anchor="start">Each request has its own result / future.</text>
<text x="32" y="939" font-size="22" font-weight="500" fill="#082b61" text-anchor="start">One request stays within one replica.</text>
<rect x="32" y="963" width="496" height="69" rx="12" fill="#d9ed69" stroke="#d9ed69"/>
<text x="56" y="991" font-size="23" font-weight="600" fill="#082b61" text-anchor="start">More replicas increase</text>
<text x="56" y="1020" font-size="23" font-weight="600" fill="#082b61" text-anchor="start">independent work capacity.</text>
<text x="32" y="1060" font-size="20" font-weight="400" fill="#555b54" text-anchor="start">No global batch split/merge.</text>
<text x="32" y="1088" font-size="20" font-weight="400" fill="#555b54" text-anchor="start">No training gradient sync.</text>
</svg>
