<text x="641" y="406" font-size="24" font-weight="600" fill="#082b61" text-anchor="start" class="">Quantize selected projections</text>
<text x="641" y="445" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Language model + action expert</text>
<text x="641" y="481" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Attention / MLP → INT4, group size 128</text>
