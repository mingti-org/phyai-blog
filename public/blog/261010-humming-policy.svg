<text x="74" y="445" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Vision · embeddings · normalization</text>
<text x="74" y="481" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Action / time heads · optional value head</text>
