<text x="48" y="87" font-size="32" font-weight="600" fill="#191c19" text-anchor="start" class="">Selective quantization in PI0.5</text>
<text x="48" y="123" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">One policy describes both the weight format and the execution kernel.</text>
