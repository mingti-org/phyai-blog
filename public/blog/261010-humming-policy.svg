<rect x="431" y="173" width="721" height="121" rx="12" fill="#082b61" stroke="#082b61"/>
<text x="457" y="215" font-size="25" font-weight="600" fill="white" text-anchor="start" class="">Kernel policy YAML</text>
<text x="457" y="255" font-size="22" font-weight="400" fill="#d8e7ff" text-anchor="start" class="">Layer matching + precision + kernel selection</text>
<path d="M791 294V325H320V355" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M791 325H888V355" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
