<rect x="48" y="252" width="1104" height="80" rx="12" fill="#082b61" stroke="#082b61"/>
<text x="600" y="284" font-size="27" font-weight="600" fill="#fff" text-anchor="middle">Engine / RequestDispatcher</text>
<text x="600" y="315" font-size="21" font-weight="400" fill="#d8e7ff" text-anchor="middle">Routes each whole request to one replica</text>
