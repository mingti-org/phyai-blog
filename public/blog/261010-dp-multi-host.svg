<text x="444" y="200" font-size="30" font-weight="600" fill="#fff" text-anchor="start">PhyAI Gateway</text>
<text x="444" y="241" font-size="23" font-weight="500" fill="#fff" text-anchor="start" data-box="438,214,693,33">Selects a healthy model server by in-flight count</text>
<text x="444" y="277" font-size="19" font-weight="400" fill="#d8e7ff" text-anchor="start" data-box="438,251,693,31">Counts requests per server; routes among all four servers.</text>
