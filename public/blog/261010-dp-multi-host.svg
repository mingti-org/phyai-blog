<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Inference data parallelism across two hosts</title>
<desc id="desc">Independent requests from application and robot clients reach the PhyAI Gateway. The gateway selects a healthy model server using server-level in-flight counts. Host A runs model servers A0 and A1; Host B runs B0 and B1. Each model server has its own Engine and one complete PI0.5 model on one GPU. There are four complete model copies in total. Each request goes to one replica. This is a conceptual topology, not measured throughput.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="#0756c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text {font-family: "Helvetica Neue", Arial, sans-serif;}</style>
<rect x="0" y="0" width="1200" height="800" rx="18" fill="#fff"/>
<text x="48" y="44" font-size="16" font-weight="700" fill="#0756c9" text-anchor="start">INFERENCE DATA PARALLELISM</text>
<text x="48" y="87" font-size="34" font-weight="600" fill="#082b61" text-anchor="start">Inference DP across hosts</text>
<text x="48" y="122" font-size="21" font-weight="400" fill="#555b54" text-anchor="start">Route independent requests to four full PI0.5 replicas.</text>
<rect x="48" y="157" width="290" height="139" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
