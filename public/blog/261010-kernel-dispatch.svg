<text x="72" y="309" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">GPU architecture</text>
<text x="72" y="351" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Tensor shape and dtype</text>
<text x="72" y="393" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Quantization layout</text>
<text x="72" y="435" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Model role / Graph mode</text>
<path d="M332 332H387" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
