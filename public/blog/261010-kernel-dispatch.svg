<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">From model operation to execution kernel</title><desc id="desc">Operation requirements and a user policy select a compatible backend. Prepared choices are reused on repeated calls.</desc>
