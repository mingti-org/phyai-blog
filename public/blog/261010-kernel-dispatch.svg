<text x="48" y="44" font-size="16" font-weight="700" fill="#0756c9" text-anchor="start" class="">KERNEL DISPATCH</text>
<text x="48" y="87" font-size="32" font-weight="600" fill="#191c19" text-anchor="start" class="">From model operation to execution kernel</text>
<text x="48" y="123" font-size="20" font-weight="400" fill="#555b54" text-anchor="start" class="">Keep workload requirements explicit. Reuse the selection machinery.</text>
