<text x="461" y="266" font-size="21" font-weight="600" fill="white" text-anchor="start" class="">Check capabilities</text>
<text x="420" y="296" font-size="18" font-weight="400" fill="#d8e7ff" text-anchor="start" class="">Can this kernel execute the call?</text>
<text x="420" y="347" font-size="17" font-weight="700" fill="#d9ed69" text-anchor="start" class="">02</text>
<text x="461" y="347" font-size="21" font-weight="600" fill="white" text-anchor="start" class="">Apply the policy</text>
<text x="420" y="377" font-size="18" font-weight="400" fill="#d8e7ff" text-anchor="start" class="">Priorities, restrictions, fallback</text>
