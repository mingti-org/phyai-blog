<text x="28" y="38" font-size="15" font-weight="700" fill="#0756c9" text-anchor="start">INFERENCE DATA PARALLELISM</text>
<text x="28" y="82" font-size="31" font-weight="600" fill="#082b61" text-anchor="start" data-box="24,48,512,42">Inference DP across hosts</text>
<text x="28" y="116" font-size="21" font-weight="400" fill="#555b54" text-anchor="start">Four full PI0.5 replicas on two hosts.</text>
<rect x="36" y="145" width="496" height="94" rx="12" fill="#edf3fc" stroke="#c5d8f4"/>
<text x="60" y="182" font-size="24" font-weight="600" fill="#082b61" text-anchor="start">Independent requests</text>
<text x="60" y="216" font-size="19" font-weight="400" fill="#555b54" text-anchor="start" data-box="52,190,468,33">Application clients · Robot clients · LeRobot</text>
<path d="M284 239V273" fill="none" stroke="#0756c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="283" width="496" height="126" rx="12" fill="#082b61"/>
