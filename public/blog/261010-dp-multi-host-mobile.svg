<text x="60" y="360" font-size="22" font-weight="500" fill="#fff" text-anchor="start" data-box="52,334,468,32">Selects a healthy model server</text>
<text x="60" y="392" font-size="20" font-weight="400" fill="#d8e7ff" text-anchor="start" data-box="52,367,468,33">Uses server-level in-flight counts</text>
